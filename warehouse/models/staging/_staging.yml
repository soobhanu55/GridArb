version: 2
models:
  - name: stg_dim_model
    columns:
      - name: model_key
        tests: [unique, not_null]
      - name: model
        tests: [unique, not_null]
      - name: family
        tests:
          - accepted_values:
              values: [baseline, classical, tree, neural]
  - name: stg_dim_date
    columns:
      - name: date_key
        tests: [unique, not_null]
      - name: day
        tests: [unique, not_null]
  - name: stg_model_summary
    columns:
      - name: model_key
        tests:
          - unique
          - not_null
          - relationships: {to: ref('stg_dim_model'), field: model_key}
      - name: total_profit_eur
        tests: [not_null]
  - name: stg_model_day
    columns:
      - name: model_key
        tests:
          - not_null
          - relationships: {to: ref('stg_dim_model'), field: model_key}
      - name: date_key
        tests:
          - not_null
          - relationships: {to: ref('stg_dim_date'), field: date_key}
      - name: profit_eur
        tests: [not_null]
